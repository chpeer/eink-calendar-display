; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:dfrobot_firebeetle2_esp32e]
; pinned to the same platform/framework as esp32-weather-epd
; (arduino-esp32 2.0.17 / ESP-IDF 4.4.7) so ADC behaviour is identical
platform = espressif32 @ 6.13.0
board = dfrobot_firebeetle2_esp32e
framework = arduino
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L
build_unflags = '-std=gnu++11'
build_flags = '-Wall' '-std=gnu++17'
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2 @ 1.6.8
    bblanchon/ArduinoJson @ 7.4.3

; Native testing environment (runs on your PC)
[env:native]
platform = native
build_flags =
    -D UNIT_TEST
    -std=gnu++17
    -I include
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
